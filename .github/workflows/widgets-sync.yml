# Keeps the desktop widgets on the latest Widgets Pack release.
# Daily (and on demand): if github.com/maxhayim/widgets-pack has a release newer than the one pinned in package.json,
# move the pin to it, build, commit "Widgets Pack <tag>" to main, and deploy. If the build fails, open an issue instead.
name: Widgets Pack sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: widgets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(jq -r '.dependencies["widgets-pack"]' package.json | sed 's/.*#//')
          latest=$(gh api repos/maxhayim/widgets-pack/releases/latest --jq .tag_name)
          echo "Pinned $pinned; latest Widgets Pack release is $latest"
          newest=$(printf '%s\n%s\n' "${pinned#v}" "${latest#v}" | sort -V | tail -1)
          if [ "$newest" = "${pinned#v}" ]; then
            echo "Up to date."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Move the pin and build
        id: build
        if: steps.check.outputs.update == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci
          npm install --save "github:maxhayim/widgets-pack#${{ steps.check.outputs.latest }}"
          npm run build

      - name: Commit, push, and deploy
        if: steps.check.outputs.update == 'true' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Widgets Pack ${{ steps.check.outputs.latest }}"
          git push
          # A push made with this workflow's token doesn't start other workflows, so start the deploy directly
          gh workflow run deploy.yml --ref main

      - name: Open an issue if the build failed
        if: steps.check.outputs.update == 'true' && steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="${{ steps.check.outputs.latest }}"
          title="Widgets Pack $latest doesn't build on the site"
          if [ "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)" != "0" ]; then
            echo "An issue for $latest is already open."
            exit 0
          fi
          {
            echo "The daily sync tried to move the widgets from **${{ steps.check.outputs.pinned }}** to **$latest**, but the site didn't build, so nothing was pushed."
            echo
            echo "- Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Release: https://github.com/maxhayim/widgets-pack/releases/tag/$latest"
            echo "- Changes: https://github.com/maxhayim/widgets-pack/compare/${{ steps.check.outputs.pinned }}...$latest"
          } > body.md
          gh issue create --title "$title" --body-file body.md
